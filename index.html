<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <title>Training App</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            overscroll-behavior-y: none;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-slate-950 text-white h-[100dvh] w-screen flex flex-col overflow-hidden select-none m-0 p-0">

    <!-- TOP PART -->
    <header class="relative w-full h-[12vh] min-h-[60px] bg-slate-900 border-b border-slate-800 flex items-center justify-center px-4">
        <button id="next-btn" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold text-lg px-8 py-3 rounded-xl shadow-lg shadow-blue-900/60">
            NEXT
        </button>
    </header>

    <!-- BOTTOM PART -->
    <main class="flex-1 w-full grid grid-cols-2 h-[88vh]">
        <!-- LEFT SECTION -->
        <section class="flex flex-col h-full border-r border-slate-800/60 p-3 gap-3">
            <div id="left-text" class="w-full h-[18%] bg-slate-900 rounded-xl border border-slate-800 flex items-center justify-center text-3xl sm:text-5xl font-black tracking-wider text-blue-400">
                --
            </div>
            <div class="w-full h-[82%] bg-slate-900 rounded-xl border border-slate-800 overflow-hidden flex items-center justify-center">
                <img id="left-img" src="" alt="Training Visual" class="w-full h-full object-contain block">
            </div>
        </section>

        <!-- RIGHT SECTION -->
        <section class="flex flex-col h-full p-3 gap-3">
            <div id="right-text" class="w-full h-[18%] bg-slate-900 rounded-xl border border-slate-800 flex items-center justify-center text-3xl sm:text-5xl font-black tracking-wider text-emerald-400">
                --
            </div>
            <div class="w-full h-[82%] bg-slate-900 rounded-xl border border-slate-800 overflow-hidden flex items-center justify-center">
                <img id="right-img" src="" alt="Training Visual" class="w-full h-full object-contain block">
            </div>
        </section>
    </main>

    <script>
        // Register Service Worker only on secure origins.
        if ('serviceWorker' in navigator && window.isSecureContext) {
            navigator.serviceWorker.register('./sw.js').catch((err) => console.log('SW registration failed:', err));
        }

        // Training App Core Logic
        const directions = ['FR', 'FL', 'BR', 'BL'];

        const nextBtn = document.getElementById('next-btn');
        const leftText = document.getElementById('left-text');
        const rightText = document.getElementById('right-text');
        const leftImg = document.getElementById('left-img');
        const rightImg = document.getElementById('right-img');

        function getRandomElement(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateCombination() {
            const lText = getRandomElement(directions);
            let rText;
            do {
                rText = getRandomElement(directions);
            } while (rText === lText);

            const lImgNum = Math.floor(Math.random() * 41) + 1;
            const rImgNum = Math.floor(Math.random() * 41) + 1;

            leftText.textContent = lText;
            rightText.textContent = rText;
            leftImg.src = `images/${lImgNum}.png`;
            rightImg.src = `images/${rImgNum}.png`;
        }

        nextBtn.addEventListener('click', generateCombination);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                generateCombination();
            }
        });

        generateCombination();
    </script>
</body>
</html>
